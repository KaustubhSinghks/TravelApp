<app-navbar></app-navbar>
<div class="trip-list-container">
  <header class="page-header">
    <h1>My Trips</h1>
    <button class="btn btn-primary" routerLink="/trips/new">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Plan a New Trip</span>
    </button>
  </header>

  <div class="trips-grid" *ngIf="!isLoading">
    <a *ngFor="let trip of trips" class="trip-card" [routerLink]="['/trips/view', trip.tripId]">
      <div class="card-image"
        [style.backgroundImage]="'url(assets/city-images/' + trip.destination.toLowerCase() + '/card.png)'"></div>
      <div class="card-content">
        <span class="badge" [ngClass]="trip.status">{{ trip.status }}</span>
        <h3 class="card-title">{{ trip.title }}</h3>
        <p class="card-destination">{{ trip.destination }}</p>
        <div class="card-details">
          <span>{{ trip.startDate | date: 'mediumDate' }} - {{ trip.endDate | date: 'mediumDate' }}</span>
          <span>{{ trip.numPeople }} People</span>
        </div>
        <div class="card-actions">
          <button class="btn-icon btn-edit" (click)="editTrip($event, trip.tripId!)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </button>
          <button class="btn-icon btn-delete" (click)="deleteTrip($event, trip.tripId!)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </div>
    </a>
  </div>

  <div *ngIf="trips.length === 0 && !isLoading" class="empty-state">
    <h2>No trips planned yet.</h2>
    <p>Your next adventure is just a click away.</p>
    <button class="btn btn-primary" routerLink="/trips/new">Plan Your First Trip</button>
  </div>
</div>
