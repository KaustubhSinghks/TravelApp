<app-navbar></app-navbar>
<div class="payment-container">
  <div class="payment-card" *ngIf="payment">
    <h2>Pay with Net Banking</h2>
    <p class="amount-display">Amount: <strong>₹{{ payment.amount | number:'1.2-2' }}</strong></p>
    <form [formGroup]="netbankingForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Bank Name</label>
        <input type="text" formControlName="bankName" placeholder="e.g., State Bank of India">
      </div>
      <div class="form-group">
        <label>Account Number</label>
        <input type="text" formControlName="accountNumber" placeholder="Enter your account number">
      </div>
      <div class="form-group">
        <label>IFSC Code</label>
        <input type="text" formControlName="ifscCode" placeholder="e.g., SBIN0001234">
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" routerLink="/payment/methods"
          [state]="{ payment: payment }">Back</button>
        <button type="submit" class="btn btn-primary" [disabled]="isLoading || netbankingForm.invalid">
          {{ isLoading ? 'Processing...' : 'Pay Now' }}
        </button>
      </div>
    </form>
  </div>
</div>
