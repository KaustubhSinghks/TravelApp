<app-navbar></app-navbar>
<div class="payment-container">
  <div class="payment-card" *ngIf="payment">
    <div class="card-top">
      <div class="card-chip"></div>
      <div class="card-logo">VISA</div>
    </div>
    <h2>Pay with Card</h2>
    <p class="amount-display">Amount: <strong>₹{{ payment.amount | number:'1.2-2' }}</strong></p>
    <form [formGroup]="cardForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Card Number</label>
        <input type="text" formControlName="cardNumber" placeholder="1234 5678 9012 3456">
      </div>
      <div class="form-group">
        <label>Card Holder Name</label>
        <input type="text" formControlName="cardHolderName" placeholder="Name as on card">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Expiry</label>
          <div class="expiry-inputs">
            <input type="text" formControlName="expiryMonth" placeholder="MM">
            <span>/</span>
            <input type="text" formControlName="expiryYear" placeholder="YY">
          </div>
        </div>
        <div class="form-group">
          <label>CVV</label>
          <input type="password" formControlName="cvv" placeholder="123">
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" routerLink="/payment/methods"
          [state]="{ payment: payment }">Back</button>
        <button type="submit" class="btn btn-primary" [disabled]="isLoading || cardForm.invalid">
          {{ isLoading ? 'Processing...' : 'Pay Now' }}
        </button>
      </div>
    </form>
  </div>
</div>
